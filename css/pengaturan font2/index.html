<html>
<head>
    <title>pengaturan font</title>
    <style type="text/css">
        p.normal{
                    font-size : verdana ;
                    font-style: normal ;}
        p.thick{
                    font-family : verdana ;
                    font-style : bold ;}
        p.thicker{
                    font-family: times ;
                    font-weight : 900;}
    </style>
</head>
<body>
    <p class="normal"> this is a paragraph</p>
    <p class="thick"> this is a paragraph</p>
    <p class="thicker"> this is a paragraph</p>
</body>
</html>
